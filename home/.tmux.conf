#Mouse settings
set -g mouse on

#Binds
bind R source ~/.tmux.conf \; display-message "Configuration sourced..."

#vim like copy/paste
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection

set -g set-clipboard on

#Powerline statusbar
set -g status on
set -g status-interval 10
set -g status-fg colour231
set -g status-bg colour234
set -g status-left-length 20
set -g status-left '#{?client_prefix,#[fg=colour254]#[bg=colour31]#[bold],#[fg=colour16]#[bg=colour254]#[bold]} #S #{?client_prefix,#[fg=colour31]#[bg=colour234]#[nobold],#[fg=colour254]#[bg=colour234]#[nobold]}'
set -g status-right '#(eval cut -c3- ~/.tmux.conf | sh -s status_right) #h | %H:%M'
set -g status-right-length 150
set -g window-status-format " #[fg=colour240] #[default]#W "
set -g window-status-current-format "#[fg=colour234,bg=colour31] #[fg=colour231,bold]#W #[fg=colour31,bg=colour234,nobold]"

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# The following is managed by tpm
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control' # Control panes like vim
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/sessionist'
set -g @plugin 'tmux-plugins/tmux-resurrect'

#Initialize tmp (this should be at the bottom)
run '~/.tmux/plugins/tpm/tpm'
